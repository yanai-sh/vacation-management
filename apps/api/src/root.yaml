openapi: 3.0.3
info:
  title: Vacation Management API
  version: 1.0.0
paths:
  /health:
    get:
      x-handler: handlers/health#getHealth
      summary: Health check including database connectivity
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Service is degraded

  /auth/login:
    post:
      x-handler: handlers/auth#postLogin
      x-inputParser: handlers/auth#parseLoginInput
      summary: Login and receive a JWT
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      x-handler: handlers/auth#getMe
      summary: Current authenticated user
      responses:
        '200':
          description: Current user
        '401':
          description: Unauthorized

  /vacation-requests:
    get:
      x-handler: handlers/vacations#getOwnVacationRequests
      summary: List the authenticated requester's vacation requests
      responses:
        '200':
          description: Request list
    post:
      x-handler: handlers/vacations#postVacationRequest
      x-inputParser: handlers/vacations#parseCreateVacationInput
      summary: Submit a vacation request
      responses:
        '201':
          description: Created
        '400':
          description: Validation error
        '409':
          description: Overlap conflict

  /vacation-requests/:id:
    delete:
      x-handler: handlers/vacations#deleteOwnVacationRequest
      x-inputParser: handlers/vacations#parseVacationIdInput
      summary: Cancel own pending vacation request
      responses:
        '200':
          description: Cancelled

  /validator/vacation-requests:
    get:
      x-handler: handlers/vacations#getValidatorVacationRequests
      x-inputParser: handlers/vacations#parseValidatorVacationRequestsInput
      summary: List all vacation requests with filters and pagination
      responses:
        '200':
          description: Paginated list

  /validator/vacation-requests/:id/approve:
    post:
      x-handler: handlers/vacations#postApproveVacationRequest
      x-inputParser: handlers/vacations#parseVacationIdInput
      summary: Approve a pending vacation request
      responses:
        '200':
          description: Approved

  /validator/vacation-requests/:id/reject:
    post:
      x-handler: handlers/vacations#postRejectVacationRequest
      x-inputParser: handlers/vacations#parseRejectVacationInput
      summary: Reject a pending vacation request
      responses:
        '200':
          description: Rejected

  /validator/users:
    get:
      x-handler: handlers/vacations#getRequesterUsers
      summary: List requesters for validator filters
      responses:
        '200':
          description: User list

  /team/vacation-requests:
    get:
      x-handler: handlers/vacations#getTeamVacationRequests
      summary: Pending and approved time off (name, status, and dates)
      responses:
        '200':
          description: Team requests
