openapi: 3.0.3
info:
  title: Vacation Management API
  version: 1.0.0
paths:
  /health:
    get:
      x-handler: handlers/health#getHealth
      summary: Health check including database connectivity
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Service is degraded

  /echo:
    post:
      x-handler: handlers/echo#postEcho
      x-inputParser: handlers/echo#parseEchoInput
      summary: Echo a message from the request body
      responses:
        '200':
          description: Echo response
        '400':
          description: Invalid input

  /auth/login:
    post:
      x-handler: handlers/auth#postLogin
      x-inputParser: handlers/auth#parseLoginInput
      summary: Login and receive a JWT
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      x-handler: handlers/auth#getMe
      summary: Current authenticated user
      responses:
        '200':
          description: Current user
        '401':
          description: Unauthorized
