services:
  postgres:
    # PostgreSQL has no separate LTS channel; each major is supported ~5 years.
    # 18 is the current stable GA (through Nov 2030). Pin a minor for reproducibility.
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vacation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacation}
      POSTGRES_DB: ${POSTGRES_DB:-vacation_management}
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (not .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vacation} -d ${POSTGRES_DB:-vacation_management}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
